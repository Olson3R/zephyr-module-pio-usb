description: |
  Pico-PIO-USB device controller. Bit-banged USB Full-Speed device on an
  RP2040 PIO state machine, exposed as a Zephyr UDC.

  Phase 2 scaffold: the underlying driver is currently a stub that returns
  -ENOSYS for all operations. The binding is published now so devicetrees
  can reference it during integration work.

  Mutually exclusive with raspberrypi,pio-usb-host at build time — both
  drivers share PIO0 with different state-machine programs.

compatible: "raspberrypi,pio-usb-device"

include: base.yaml

properties:
  pinctrl-0:
    required: true
    description: |
      Pinctrl group selecting the consecutive D+/D- GPIO pair. D+ is the
      lower-numbered pin; D- is D+ + 1.

  pinctrl-names:
    required: true

  pio:
    type: phandle
    required: true
    description: PIO instance the device state machine programs run on.

  data-rate:
    type: string
    enum:
      - "full-speed"
      - "low-speed"
    default: "full-speed"
    description: USB bus speed. Full-speed is the only well-tested mode.
