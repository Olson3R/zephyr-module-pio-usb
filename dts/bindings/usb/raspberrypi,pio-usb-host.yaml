description: |
  Pico-PIO-USB host controller. Bit-banged USB Full-Speed host on an RP2040
  PIO state machine, exposed as a Zephyr UHC.

  Phase 2 scaffold: the underlying driver is currently a stub that returns
  -ENOSYS for all operations. The binding is published now so devicetrees
  can reference it during integration work.

compatible: "raspberrypi,pio-usb-host"

include: base.yaml

properties:
  pin-dp:
    type: int
    required: true
    description: |
      RP2040 GPIO number of the D+ pin. D- must be on the adjacent GPIO —
      either DP+1 or DP-1, selected by the `pinout` property. Pico-PIO-USB
      drives both pins directly; do not configure them via pinctrl.

  pinout:
    type: string
    enum:
      - "dpdm"
      - "dmdp"
    default: "dpdm"
    description: |
      Order of the D+/D- pin pair. "dpdm" means D- = DP + 1 (the common
      case for USB-C dongles). "dmdp" means D- = DP - 1.

  pio:
    type: phandle
    description: |
      PIO instance the host state machine programs run on. Optional —
      Pico-PIO-USB hardcodes PIO0 today; this property is reserved for
      future multi-PIO support and is currently informational only.

  data-rate:
    type: string
    enum:
      - "full-speed"
      - "low-speed"
    default: "full-speed"
    description: USB bus speed. Full-speed is the only well-tested mode.

  pinctrl-0:
    description: |
      Optional pinctrl group. Pico-PIO-USB configures the D+/D- pins
      itself; this property is provided for boards that want to reserve
      the pins through the pinctrl framework. Most boards omit it.

  pinctrl-names:
    description: Required when pinctrl-0 is set.
