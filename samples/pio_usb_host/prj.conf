# SPDX-License-Identifier: MIT
#
# Pico-PIO-USB host standalone sample. Brings up the UHC driver and logs
# device-connect / device-removed events. Use to validate uhc_pio_usb on
# a Lemon Wired (or any RP2040 board) with a USB-FS device plugged into
# the configured Link USB-C port.

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192
# Default to INFO so the legacy USB stack's debug chatter doesn't drown
# out the sample's own logs. Bump our module + uhc_pio_usb to DEBUG
# below.
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y
# Synchronous logging — no deferred log thread, every LOG_*/printk
# flushes to the backend immediately. Trades performance for visibility,
# fine for a triage build.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USB_DRIVER_LOG_LEVEL_INF=y
CONFIG_UHC_DRIVER_LOG_LEVEL_DBG=y
CONFIG_USB_DEVICE_LOG_LEVEL_INF=y

CONFIG_UHC_DRIVER=y
CONFIG_UHC_PIO_USB=y

# Logs go to the native USBD console (CDC ACM). Plug the native USB-C
# port into your computer to see them.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Cosmos Lemon UHC Test"
CONFIG_USB_DEVICE_PID=0x0002
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

# Skip the broken flash_rpi_pico driver and storage we don't need.
CONFIG_FLASH=n
CONFIG_NVS=n
CONFIG_SETTINGS=n
