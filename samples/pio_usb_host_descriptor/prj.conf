# SPDX-License-Identifier: MIT
#
# Pico-PIO-USB host descriptor-dump sample. Enumerates the device plugged
# into the Link USB-C port (bus reset → GET_DESCRIPTOR(DEV,8) → SET_ADDRESS
# → GET_DESCRIPTOR(DEV,18) → string descriptors) and prints the result to
# the CDC ACM console on the native USB-C port. Modeled after tinyusb's
# dual/host_info_to_device_cdc example.

CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y
# Synchronous logging — every LOG_*/printk flushes to the backend
# immediately. Trades performance for visibility, fine for an enumeration
# probe whose interesting output is a one-shot burst.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USB_DRIVER_LOG_LEVEL_INF=y
CONFIG_UHC_DRIVER_LOG_LEVEL_INF=y
CONFIG_USB_DEVICE_LOG_LEVEL_INF=y

CONFIG_UHC_DRIVER=y
CONFIG_UHC_PIO_USB=y

# Logs go to the native USBD console (CDC ACM). Plug the native USB-C
# port into your computer to see them.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Cosmos Lemon UHC Descriptor Dump"
CONFIG_USB_DEVICE_PID=0x0003
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

# We allocate a 256-byte net_buf for the descriptor data stage; bump the
# global net_buf budget enough to hold a few in flight.
CONFIG_NET_BUF=y

# Skip the broken flash_rpi_pico driver and storage we don't need.
CONFIG_FLASH=n
CONFIG_NVS=n
CONFIG_SETTINGS=n
