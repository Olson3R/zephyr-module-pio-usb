# SPDX-License-Identifier: MIT
#
# Pico-PIO-USB device standalone sample. Brings up udc_pio_usb on a
# Lemon Wired and exposes a CDC ACM device on the configured Link
# USB-C port via Zephyr's USBD-next stack.
#
# Logs go out the native USB-C port via a separate CDC ACM instance.
# The CDC ACM that the Link port presents is the test endpoint — type
# in the host's tty and it should echo back.

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USB_DRIVER_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_DBG=y
CONFIG_USB_DEVICE_LOG_LEVEL_INF=y

# udc_pio_usb on the Link USB-C port (PIO-driven).
CONFIG_UDC_DRIVER=y
CONFIG_UDC_PIO_USB=y
CONFIG_DYNAMIC_INTERRUPTS=y

# Legacy USB device stack on the native USB-C port for serial console
# only — no USBD-next on Link. Once udc_pio_usb is hardware-validated,
# add USBD-next + CDC ACM back to expose a real CDC ACM device on Link.
# Both stacks can't define CDC ACM concurrently (linker conflict on
# duplicated DT instance ordinals), so this triage build trades the
# Link-side test endpoint for a native serial console.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Cosmos Lemon UDC Triage"
CONFIG_USB_DEVICE_PID=0x0004
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

# Skip flash and NVS — not needed for the smoke test.
CONFIG_FLASH=n
CONFIG_NVS=n
CONFIG_SETTINGS=n
