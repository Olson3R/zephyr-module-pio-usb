# SPDX-License-Identifier: MIT
#
# Pico-PIO-USB device standalone sample. Brings up udc_pio_usb on a
# Lemon Wired and exposes a CDC ACM device on the configured Link
# USB-C port via Zephyr's USBD-next stack.
#
# Logs go out the native USB-C port via a separate CDC ACM instance.
# The CDC ACM that the Link port presents is the test endpoint — type
# in the host's tty and it should echo back.

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_PRINTK=y

CONFIG_UDC_DRIVER=y
CONFIG_UDC_PIO_USB=y
CONFIG_DYNAMIC_INTERRUPTS=y

# Force the USBD-next stack only — without this Zephyr builds both the
# legacy and the new CDC ACM driver and the linker chokes on duplicated
# DT instance ordinals.
CONFIG_USB_DEVICE_STACK=n

# Zephyr USBD-next on top of our UDC. CDC ACM class registered against
# the udc_pio_usb device.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_INF=y

CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Skip flash and NVS — not needed for the smoke test.
CONFIG_FLASH=n
CONFIG_NVS=n
CONFIG_SETTINGS=n
