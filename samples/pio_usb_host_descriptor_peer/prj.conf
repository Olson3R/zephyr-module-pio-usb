# SPDX-License-Identifier: MIT
#
# Pico-PIO-USB host descriptor-dump sample's deterministic test peer.
# Stand-up a Zephyr USB device on the native USB block with a fixed
# VID / PID / manufacturer / product / serial-number string set so the
# host-side `pio_usb_host_descriptor` sample's "Expected output" block
# is reproducible — flash this on a second board, plug its native USB-C
# into the host's Link USB-C, watch the descriptor dump match exactly.
#
# This is intentionally minimal: just the legacy USB device stack with
# CDC ACM as the (unused) interface so the device has at least one
# class to enumerate. No data flows in either direction at runtime;
# this peer exists to expose a stable device descriptor and that's it.

CONFIG_MAIN_STACK_SIZE=1024

CONFIG_LOG=n

# Legacy USB device stack on the native USB block (zephyr_udc0). Init
# at boot so the device responds to the host's first SETUP without
# waiting for application code. Single CDC ACM interface keeps the
# enumeration trivial — the host's `pio_usb_host_descriptor` only
# walks the device descriptor, so the configuration descriptor's
# contents don't matter much; CDC ACM just gives us *some* class.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_VID=0x2fe3
CONFIG_USB_DEVICE_PID=0x42aa
CONFIG_USB_DEVICE_MANUFACTURER="zephyr-pio-usb"
CONFIG_USB_DEVICE_PRODUCT="PIO-USB descriptor host test peer"
CONFIG_USB_DEVICE_SN="DESCTEST"

CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# This board family ships with broken in-tree flash drivers we don't
# need anyway. Match what the rest of the samples and the rainadon-zmk
# Lemon Wired confs do to avoid build failures on the FLASH/NVS path.
CONFIG_FLASH=n
CONFIG_NVS=n
CONFIG_SETTINGS=n
